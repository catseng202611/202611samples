<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="font-size: 30px;">
    <h1>
        <span style="font-size: 1.5rem;">FontSize Em vs Rem</span>
        <span style="font-size: 1.5em;">FontSize Em vs Rem</span>
    </h1>
    <div id="font20" style="font-size: 20px;">
        <p id="fontem" style="font-size: 1em;">This is a paragraph with font size set to 1em.</p>
    </div>
    <div id="fontrem" style="font-size: 1.25rem;">
        <p>This is a paragraph with font size set to 1.25rem.</p>
    </div>
</body>
</html>
