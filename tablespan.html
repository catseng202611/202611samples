<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>我的表格合併</h1>
    <table border="1" width="100%">
        <caption style="font-size: 18px; font-weight: bold;">ColSpan RowSpan</caption>
        <thead>
            <tr>
                <th>姓名</th>
                <th>年齡</th>
                <th>性別</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>張三</td>
                <td>25</td>
                <td>男</td>
            </tr>
            <tr>
                <td>張三</td>
                <td colspan="2">27</td>
            </tr>
            <tr>
                <td>李四</td>
                <td colspan="2">27</td>
            </tr>
        </tbody>

    </table>
</body>
</html>
