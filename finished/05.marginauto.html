<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 200px;
            height: 200px;
            background-color: #ff0000;
            margin: 0 auto;
            border: rgb(72, 0, 255) solid 2px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <h1>Margin Auto Example</h1>


    <div class="box">
        <div class="box">
            <form method="get" action="">
    <input 
        type="text" 
        pattern="\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])" 
        placeholder="YYYY-MM-DD" 
        title="請輸入正確的日期格式：YYYY-MM-DD"
        required
    >
    <input type="submit" value="send">
</form>
</div>
    </div>
</body>
</html>
